# domain_map.yaml — @adonis-agora/resilience (TanStack Intent agent skills)
# Generated by skill-domain-discovery (compressed / minimal-library fast path).
# Fully autonomous: no maintainer interview was run. Every failure mode below is
# grounded in README.md, DESIGN.md, docs/*.mdx, or packages/core/src — see the
# `source` field on each entry. Unresolvable questions are recorded in `gaps`.

library:
  name: '@adonis-agora/resilience'
  version: '0.3.2'
  repository: 'https://github.com/DavideCarvalho/adonis-resilience'
  description: >-
    Resilience policies for AdonisJS — timeout, retry with backoff, circuit
    breaker, and ordered failover — composable as plain functions or named
    config-registered policies, with pluggable circuit stores (in-memory,
    Lucid/SQL, Redis).
  primary_framework: 'AdonisJS'

domains:
  - name: 'Composing and running policies'
    slug: 'policies'
    description: >-
      The policy engine a developer reasons about when making an outbound call
      survive flakiness: wrap composition order, timeout deadlines and the
      AbortSignal, retry attempts and backoff, the circuitBreaker state machine,
      failover targets, and the typed errors.
    package: '@adonis-agora/resilience'

  - name: 'Wiring resilience into an AdonisJS app'
    slug: 'app-wiring'
    description: >-
      The AdonisJS surfaces: node ace configure, config/resilience.ts, the
      provider-bound ResilienceService singleton, named policies, the
      @withResilience method decorator, event sinks/diagnostics, and tenant keys.

  - name: 'Owning circuit state'
    slug: 'stores'
    description: >-
      Where breaker state lives: the four-method ResilienceStore contract,
      the three built-in stores selected in config, custom stores via the three
      reuse tiers (SqlDriver / computeAdmit+computeRecord / from scratch), and
      validating against the shared contract suite.
    package: '@adonis-agora/resilience'

skills:
  - name: 'Setup, config and the ResilienceService'
    slug: 'resilience-setup-policies'
    domain: 'app-wiring'
    description: >-
      Install/configure the package, compose wrap(timeout(...), retry(...),
      circuitBreaker(...)) policies standalone, register named policies in
      config/resilience.ts with defineConfig + stores.memory(), pick a default
      circuit store, and run operations through the ResilienceService singleton
      imported from @adonis-agora/resilience/services/main (execute by name or
      ad-hoc, failover with the service sink, circuit(key).snapshot()/reset(),
      circuitStore(name?)).
    type: 'core'
    packages:
      - '@adonis-agora/resilience'
    covers:
      - 'wrap'
      - 'timeout'
      - 'retry'
      - 'exponential'
      - 'circuitBreaker'
      - 'failover'
      - 'defineConfig'
      - 'stores'
      - 'ResilienceService'
      - '@adonis-agora/resilience/services/main'
      - 'node ace configure'
      - 'PolicyContext { signal, attempt }'
      - 'TimeoutError / BrokenCircuitError'
    tasks:
      - 'Install @adonis-agora/resilience and run node ace configure to publish config/resilience.ts'
      - 'Compose timeout/retry/breaker around one outbound call and thread ctx.signal into fetch'
      - 'Register named policies in config/resilience.ts and call resilience.execute("name", op)'
      - 'Inspect or reset a circuit via resilience.circuit(key) / circuitStore(name?)'
    failure_modes:
      - mistake: 'Reading wrap arguments right-to-left'
        mechanism: >-
          wrap's first argument is the outermost layer; reading it backwards puts
          the breaker outside the retry loop so one dead dependency opens the
          circuit before any retry happens, and a whole-loop deadline becomes a
          per-attempt one.
        wrong_pattern: |
          // intended: 2s budget for the WHOLE loop; breaker per attempt
          const policy = wrap(
            circuitBreaker({ key: 'payments', store, threshold: 5, cooldownMs: 30_000 }),
            timeout(2_000), // actually innermost → bounds each retry, not the loop
            retry({ attempts: 3 }),
          )
        correct_pattern: |
          // outermost first: timeout(retry(breaker(op)))
          const policy = wrap(
            timeout(2_000),
            retry({ attempts: 3 }),
            circuitBreaker({ key: 'payments', store, threshold: 5, cooldownMs: 30_000 }),
          )
        source: 'docs/policies.mdx § "wrap — compose policies"'
        priority: 'HIGH'
        status: 'active'
        skills: ['resilience-setup-policies', 'resilience-decorator']
      - mistake: 'Ignoring PolicyContext.signal so timeouts cannot cancel'
        mechanism: >-
          The timeout policy rejects with TimeoutError at the deadline but can only
          cancel work that listens; without threading signal into fetch/driver the
          abandoned request keeps running and holds connections under load.
        wrong_pattern: |
          await resilience.execute('payments', () =>
            fetch('https://api.stripe.com/v1/charges', { method: 'POST' }),
          ) // rejects at the deadline, request keeps running
        correct_pattern: |
          await resilience.execute('payments', ({ signal }) =>
            fetch('https://api.stripe.com/v1/charges', {
              method: 'POST',
              signal, // cooperative cancellation reaches the transport
            }).then((res) => res.json()),
          )
        source: 'docs/policies.mdx § timeout Callout; docs/getting-started.mdx step 2'
        priority: 'CRITICAL'
        status: 'active'
        skills: ['resilience-setup-policies', 'resilience-decorator']
      - mistake: 'Treating retry.attempts as re-attempts after the first try'
        mechanism: >-
          attempts counts total tries, so attempts: 3 runs the op at most three
          times; agents that assume 1 initial + N retries generate 4 tries and
          overshoot upstream rate limits and latency budgets.
        wrong_pattern: |
          // meant "3 retries" → actually up to 4 executions
          retry({ attempts: 4, backoff: exponential(100) })
        correct_pattern: |
          // three total tries, waiting 100ms then 200ms between them
          retry({ attempts: 3, backoff: exponential(100) })
        source: 'docs/policies.mdx § "retry and backoff" ("attempts: 3 means three total tries")'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['resilience-setup-policies']
      - mistake: 'Expecting events from hand-built policies passed to execute()'
        mechanism: >-
          A policy captures its sink when it is BUILT, not when it runs; only named
          factories registered under `policies` get the service's diagnostics/emitter
          sink injected, so execute(myWrap) is silently silent while
          execute('payments') emits agora:resilience:* events.
        wrong_pattern: |
          const policy = wrap(timeout(2_000), retry({ attempts: 3 })) // built at module scope
          await resilience.execute(policy, op) // no diagnostics, no emitter mirror
        correct_pattern: |
          // config/resilience.ts — built inside the factory window → emits
          policies: { payments: () => wrap(timeout(2_000), retry({ attempts: 3 })) }
          // ...or wire the sink yourself:
          await resilience.execute(timeout(1_000, { onEvent: diagnosticsSink() }), op)
        source: 'docs/integrations.mdx § "Which policies get the service''s sink"'
        priority: 'HIGH'
        status: 'active'
        skills: ['resilience-setup-policies']
      - mistake: 'Calling circuitStore(name) for an unregistered store name'
        mechanism: >-
          Only stores listed under config.stores are resolvable by name;
          circuitStore throws `Unknown resilience store "<name>".` otherwise, and
          the same error hits a policy factory that resolves a store nobody listed.
        wrong_pattern: |
          // config lists only memory, but code assumes redis exists:
          const store = resilience.circuitStore('redis')
          circuitBreaker({ key: 'cart', store, threshold: 5, cooldownMs: 30_000 })
        correct_pattern: |
          // list it first: stores: { memory: stores.memory(), redis: stores.redis({ connection: 'main' }) }
          const store = resilience.circuitStore('redis')
          circuitBreaker({ key: 'cart', store, threshold: 5, cooldownMs: 30_000 })
        source: 'packages/core/src/resilience_service.ts (requireStore); docs/custom-store.mdx § "Reaching it from code"'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['resilience-setup-policies']

  - name: 'Declarative method decoration'
    slug: 'resilience-decorator'
    domain: 'app-wiring'
    description: >-
      Apply fixed policies to async class methods declaratively with
      @withResilience(...) — argument order mirrors wrap, this/args/return type are
      preserved, only async methods can be decorated, circuitBreaker needs an
      explicit store because there is no per-request container at class-definition
      time (pass InMemoryResilienceStore / lucidResilienceStore(db) /
      resilience.circuitStore()), and prefer service.execute when the timeout must
      genuinely abort the transport.
    type: 'core'
    packages:
      - '@adonis-agora/resilience'
    covers:
      - 'withResilience'
      - '@withResilience decorator'
      - 'composition order mirrors wrap'
      - 'explicit circuit-breaker store at class-definition time'
      - 'lucidResilienceStore(db)'
      - 'resilience.circuitStore()'
    tasks:
      - 'Attach timeout/retry/circuitBreaker to a client method once instead of wrapping every call site'
      - 'Give a decorated breaker a Lucid or Redis-backed store built at module scope'
      - 'Decide between @withResilience and resilience.execute(wrap(...), op) for per-request policies'
    failure_modes:
      - mistake: 'Decorating a non-async method with withResilience'
        mechanism: >-
          Policies are promise-based, so only async methods can be decorated; a
          sync method breaks the contract the decorator relies on instead of being
          wrapped.
        wrong_pattern: |
          class InventoryClient {
            @withResilience(retry({ attempts: 3 }))
            check(sku: string): Stock { return this.db.find(sku) } // sync — cannot be wrapped
          }
        correct_pattern: |
          class InventoryClient {
            @withResilience(retry({ attempts: 3 }))
            async check(sku: string): Promise<Stock> { return this.db.find(sku) }
          }
        source: 'docs/decorator.mdx § "The method shape" ("Only async methods can be decorated")'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['resilience-decorator']
      - mistake: 'Assuming a decorator timeout cancels the underlying request'
        mechanism: >-
          The decorator calls the method with its original arguments and has nowhere
          to hand over the PolicyContext, so ctx.signal never reaches the body; the
          promise rejects with TimeoutError while the HTTP call runs to completion
          and holds the connection — use execute(({signal}) => ...) when the
          deadline must reach the transport.
        wrong_pattern: |
          class PaymentClient {
            @withResilience(timeout(1_000), retry({ attempts: 3 }))
            async charge(amount: number) {
              return this.http.post('/charge', { amount }) // no signal → never aborted
            }
          }
        correct_pattern: |
          charge(amount: number) {
            return resilience.execute(policy, ({ signal }) =>
              this.http.post('/charge', { amount }, { signal }),
            )
          }
        source: 'docs/decorator.mdx Callout "A timeout here rejects, but does not cancel"'
        priority: 'CRITICAL'
        status: 'active'
        skills: ['resilience-decorator', 'resilience-custom-stores-testing']
      - mistake: 'Omitting the required store on a decorated circuitBreaker'
        mechanism: >-
          A method decorator runs at class-definition time, so there is no
          per-request container to resolve a store from and none is implicit;
          circuitBreaker requires an explicit store option and the omission is a
          type error at best, a broken pipeline at worst.
        wrong_pattern: |
          @withResilience(circuitBreaker({ key: 'pay', threshold: 5, cooldownMs: 30_000 }))
          async pay() {} // no store — nothing defines where breaker state lives
        correct_pattern: |
          import resilience from '@adonis-agora/resilience/services/main'
          const store = resilience.circuitStore() // or new InMemoryResilienceStore()
          class PaymentClient {
            @withResilience(circuitBreaker({ key: 'pay', store, threshold: 5, cooldownMs: 30_000 }))
            async pay() {}
          }
        source: 'docs/decorator.mdx § "Providing a store"; packages/core/src/policies/circuit_breaker.ts (store is required)'
        priority: 'HIGH'
        status: 'active'
        skills: ['resilience-decorator']

  - name: 'Circuit stores, custom backends and testing'
    slug: 'resilience-custom-stores-testing'
    domain: 'stores'
    description: >-
      Choose where breaker state lives: stores.memory() per process vs
      stores.lucid({ connection }) SQL vs stores.redis({ connection }) distributed,
      every listed store is built at boot so only list peers you installed,
      CIRCUITS_DDL migrations with autoCreateSchema:false, snapshot() lagging the
      half-open transition, custom engines via SqlResilienceStore + SqlDriver or
      the pure computeAdmit/computeRecord state machine or StoreProvider thunks,
      wiring through defineConfig({ store }), and proving correctness with
      runResilienceStoreContract from @adonis-agora/resilience/testing plus FakeClock
      for deterministic timeout/backoff/cooldown tests.
    type: 'core'
    packages:
      - '@adonis-agora/resilience'
    covers:
      - 'ResilienceStore (admit/record/snapshot/reset)'
      - 'stores.memory / stores.lucid / stores.redis'
      - 'InMemoryResilienceStore'
      - 'SqlResilienceStore + SqlDriver'
      - 'computeAdmit / computeRecord / INITIAL_CIRCUIT_STATE'
      - 'CIRCUITS_DDL / ensureResilienceSchema / autoCreateSchema'
      - 'StoreProvider thunk'
      - 'runResilienceStoreContract (@adonis-agora/resilience/testing)'
      - 'FakeClock'
      - 'CircuitSnapshot'
    tasks:
      - 'Move circuit state fleet-wide by pointing default at a Redis or Lucid store'
      - 'Own the schema in production via a migration and autoCreateSchema:false'
      - 'Back the breaker with a non-builtin engine and validate it with the contract suite'
      - 'Test timeouts, backoff and cooldowns deterministically with FakeClock'
    failure_modes:
      - mistake: 'Listing stores whose peer dependencies are not installed'
        mechanism: >-
          Every entry in the stores map is built at boot, not just default; each
          Lucid/Redis thunk imports its optional peer as it is built, so listing a
          store whose peer is missing crashes app startup even if that store is
          never used.
        wrong_pattern: |
          export default defineConfig({
            default: 'memory',
            stores: {
              memory: stores.memory(),
              lucid: stores.lucid({ connection: 'pg' }), // @adonisjs/lucid NOT installed → boot crash
            },
          })
        correct_pattern: |
          export default defineConfig({
            default: 'memory',
            stores: { memory: stores.memory() }, // list only stores whose peers you have
          })
        source: 'docs/stores.mdx Callout "Every listed store is built at boot"; docs/custom-store.mdx warning'
        priority: 'CRITICAL'
        status: 'active'
        skills: ['resilience-custom-stores-testing', 'resilience-setup-policies']
      - mistake: 'Building dashboards or health checks on raw snapshot() output'
        mechanism: >-
          snapshot() reads stored hash without transitioning; only admit() advances
          the state machine, so a circuit whose cooldown elapsed still reports
          status:"open" until the next admit() — compare openUntil against now for
          read-only views.
        wrong_pattern: |
          const snap = await store.snapshot('payments')
          if (snap.status === 'open') throw new Error('circuit open') // stale after cooldown
        correct_pattern: |
          const snap = await store.snapshot('payments')
          const coolingDone = snap.openUntil !== undefined && Date.now() >= snap.openUntil
          if (snap.status === 'open' && !coolingDone) throw new Error('circuit open')
        source: 'docs/stores.mdx Callout "snapshot() does not advance the cooldown"'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['resilience-custom-stores-testing']
      - mistake: 'Writing a store whose admit and record are not atomic'
        mechanism: >-
          The distributed guarantee — exactly ONE instance wins the half-open probe
          under concurrent load — depends on the load→compute→persist cycle being
          indivisible; a naive read-then-write store lets two instances both probe
          and double-hammer a recovering dependency, and only passing
          runResilienceStoreContract proves it correct.
        wrong_pattern: |
          async admit(key, cfg) {
            const prev = await db.load(key)
            const { state, admission } = computeAdmit(prev ?? INITIAL_CIRCUIT_STATE, cfg, clock.now())
            await db.save(key, state) // separate round-trips → interleaved under load
            return admission
          }
        correct_pattern: |
          async admit(key, cfg) {
            return engine.atomically(key, async (tx) => {
              const prev = (await tx.load(key)) ?? { ...INITIAL_CIRCUIT_STATE }
              const { state, admission } = computeAdmit(prev, cfg, this.clock.now())
              await tx.save(key, state)
              return admission
            })
          }
        source: 'docs/custom-store.mdx "The interface you are implementing"; docs/stores.mdx atomicity Callout'
        priority: 'HIGH'
        status: 'active'
        skills: ['resilience-custom-stores-testing']
      - mistake: 'Skipping runResilienceStoreContract for a Tier-3 store'
        mechanism: >-
          A server-side reimplementation must stay byte-for-byte faithful to
          computeAdmit/computeRecord, and the contract suite is the only guard
          against drift; skipping it ships a store that passes happy-path tests but
          grants two probes under concurrency.
        wrong_pattern: |
          describe('MyRedisLuaStore', () => { /* a few hand-picked unit cases */ })
        correct_pattern: |
          import { runResilienceStoreContract } from '@adonis-agora/resilience/testing'
          runResilienceStoreContract('MyStore', (clock: Clock) => new MyStore(clock))
        source: 'docs/custom-store.mdx "You are now the source-of-truth twin" + "Validate against the contract suite"'
        priority: 'HIGH'
        status: 'active'
        skills: ['resilience-custom-stores-testing']
      - mistake: 'Using real timers when testing cooldowns and backoff'
        mechanism: >-
          Resilience is full of time; every time-dependent policy and store takes an
          injectable Clock, and tests that sleep through 30s cooldowns or 100→200ms
          backoffs are slow and flaky where FakeClock.advance(ms) fires due timers
          instantly in scheduled order.
        wrong_pattern: |
          await breaker.execute(() => Promise.reject(new Error('boom')))
          await new Promise((r) => setTimeout(r, 30_000)) // sleeps 30s, still timing-sensitive
        correct_pattern: |
          const clock = new FakeClock()
          const store = new InMemoryResilienceStore(clock)
          const breaker = circuitBreaker({ key: 'svc', store, threshold: 1, cooldownMs: 5_000 })
          clock.advance(5_000) // instant half-open
        source: 'docs/testing.mdx § "The clock seam"'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['resilience-custom-stores-testing']

tensions:
  - name: 'Decorator ergonomics vs genuine cancellation'
    skills: ['resilience-decorator', 'resilience-setup-policies']
    description: >-
      @withResilience removes boilerplate but structurally cannot pass ctx.signal
      into the method body, while service.execute hands the operation the
      PolicyContext.
    implication: >-
      Agents decorate methods with timeout(...) and assume the deadline cancels the
      HTTP call; under load abandoned requests accumulate unbounded.

  - name: 'Observability defaults vs standalone-policy silence'
    skills: ['resilience-setup-policies', 'resilience-decorator']
    description: >-
      emit:true makes the SERVICE observable, but a policy captures its sink at
      construction, so hand-built policies and decorated methods stay silent even
      though diagnostics appears configured.
    implication: >-
      Agents wire defineConfig({ emit: true }) plus a module-level wrap and conclude
      telemetry is broken when nothing arrives on agora:resilience:*.

cross_references:
  - from: 'resilience-setup-policies'
    to: 'resilience-custom-stores-testing'
    reason: >-
      Named breakers and circuitStore(name?) only resolve stores that config lists —
      choosing and registering the store is the stores skill's subject.
  - from: 'resilience-decorator'
    to: 'resilience-custom-stores-testing'
    reason: >-
      Decorated circuitBreakers need an explicit store built at module scope
      (InMemoryResilienceStore, lucidResilienceStore, or resilience.circuitStore()).
  - from: 'resilience-decorator'
    to: 'resilience-setup-policies'
    reason: >-
      Argument order mirrors wrap(top-down), and the escape hatch for real
      cancellation is service.execute — both live in the setup skill.

gaps:
  # What a maintainer interview would answer; could not be confirmed autonomously.
  - skill: 'resilience-setup-policies'
    question: >-
      Is the silent-sink rule (hand-built policies never emit) the single most
      reported confusion in issues/Discord?
    context: >-
      Docs give it an unusually long Callout, suggesting it is the top support
      topic, but no issue mining was performed in this session.
    status: 'open'
  - skill: 'resilience-decorator'
    question: >-
      How often do real users trip over the decorator's non-cancelling timeout in
      production versus treating it as acceptable fire-and-forget?
    context: >-
      The doc warns about connection accumulation under load; actual frequency is
      unknown without maintainer input or issue telemetry.
    status: 'open'
  - skill: 'resilience-custom-stores-testing'
    question: >-
      Are additional SQL drivers (Prisma/TypeORM/MikroORM/drizzle) planned soon
      enough that they deserve their own subsystem references now?
    context: >-
      DESIGN.md lists them as a follow-up; today only SqlResilienceStore-based
      reuse is documented.
    status: 'open'
