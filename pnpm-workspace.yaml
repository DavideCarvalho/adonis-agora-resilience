packages:
  - "packages/*"
# pnpm >= 10 nao roda build script de dependencia sem permissao explicita, e em CI ele
# ERRA (ERR_PNPM_IGNORED_BUILDS) em vez de so avisar -- o release morre no
# `pnpm install --frozen-lockfile` antes de chegar no changesets. Todos estes ja rodavam
# sob o pnpm 9 (biome/swc/esbuild/better-sqlite3/sharp compilam ou baixam binario), entao
# liberar preserva o comportamento; nao e permissao nova.
allowBuilds:
  '@biomejs/biome': true
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
minimumReleaseAgeExclude:
  - '@adonis-agora/filter@1.0.0-rc.5 || 1.0.0'

# Intent typechecks the skill examples from the repo root, so hoist the Adonis packages they import
# so the examples load their types (e.g. `logger`, `emitter`, `db`) against the same
# @adonisjs/core copy the library uses. Install-time only: no published package changes.
publicHoistPattern:
  - "@adonisjs/core"
  - "@adonisjs/lucid"
